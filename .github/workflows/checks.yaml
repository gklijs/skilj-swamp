name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - run: deno task check
      - run: deno task test
      - run: deno task lint
      - run: deno task fmt:check

  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        prefix: ["", "ledger"]
    env:
      SWAMP_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: Fetch pinned SkilJ 0.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gklijs/SkilJ
          ref: 93874920a737f83ecc8936d33b495d8c7c262146 # v0.4.0
          path: upstream-skilj
      - name: Build release demo
        working-directory: upstream-skilj
        run: |
          rustup toolchain install stable --profile minimal
          # The upstream release does not ship Cargo.lock.
          cargo generate-lockfile
          cargo build --locked -p skilj-demo --bin server
      - name: Install pinned Swamp runtime
        env:
          SWAMP_RELEASE: v20261104.025555.0-sha.dd659114
        run: |
          base="https://github.com/swamp-club/swamp/releases/download/$SWAMP_RELEASE"
          curl --fail --location "$base/swamp-linux-x86_64" --output swamp-linux-x86_64
          curl --fail --location "$base/checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          chmod +x swamp-linux-x86_64
          sudo mv swamp-linux-x86_64 /usr/local/bin/swamp
      - name: Prepare disposable database image
        run: docker pull postgres:17-alpine
      - name: Live REST, GraphQL and bundled workflow contracts
        env:
          CONTRACT_PREFIX: ${{ matrix.prefix }}
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
        run: |
          args=(--server upstream-skilj/target/debug/server
                --deno "$(command -v deno)" --prefix "$CONTRACT_PREFIX")
          if [[ -z "$SWAMP_API_KEY" ]]; then
            echo "::warning::SWAMP_API_KEY is unavailable. Running direct REST and GraphQL contracts only."
            python3 scripts/test-live.py "${args[@]}" --direct-only
          else
            python3 scripts/test-live.py "${args[@]}"
            swamp extension quality manifest.yaml --json
          fi
